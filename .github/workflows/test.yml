name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test dependencies
        run: python -m pip install ".[dev]"
      - name: Validate schemas and profiles
        run: python scripts/quick_validate.py .
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Collect Python diagnostics
        if: failure()
        run: |
          python -c "from pathlib import Path; import platform; directory = Path('test-results'); directory.mkdir(exist_ok=True); (directory / 'python.txt').write_text(platform.platform() + '\nPython ' + platform.python_version() + '\n', encoding='utf-8')"
          python -m pip list > test-results/packages.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: test-results/
          retention-days: 7

  cadquery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CAD and test dependencies
        run: python -m pip install ".[dev,cadquery]"
      - name: Verify CAD backend
        run: personal-3d-fabricator check-environment --require cadquery --json
      - name: Run connector and fabrication tests
        run: >-
          python -m pytest -q
          tests/test_connectors.py tests/test_geometry_workflow.py tests/test_split_evidence.py
          tests/test_end_to_end.py tests/test_project_consistency.py tests/test_tooling.py
